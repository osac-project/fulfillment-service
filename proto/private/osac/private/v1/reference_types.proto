syntax = "proto3";

package osac.private.v1;

// Networking references

// Local reference to a VirtualNetwork resource.
message VirtualNetworkLocalReference {
  string id = 1;
  string name = 2;
}

// Reference to a NetworkClass resource.
message NetworkClassReference {
  string id = 1;
  string name = 2;
  string project = 3;
  bool shared = 4;
}

// Local reference to a Subnet resource.
message SubnetLocalReference {
  string id = 1;
  string name = 2;
}

// Local reference to a SecurityGroup resource.
message SecurityGroupLocalReference {
  string id = 1;
  string name = 2;
}

// Local reference to an ExternalIP resource.
message ExternalIPLocalReference {
  string id = 1;
  string name = 2;
}

// Reference to an ExternalIPPool resource.
message ExternalIPPoolReference {
  string id = 1;
  string name = 2;
  string project = 3;
  bool shared = 4;
}

// Compute references

// Local reference to a ComputeInstance resource.
message ComputeInstanceLocalReference {
  string id = 1;
  string name = 2;
}

// Reference to a ComputeInstanceTemplate resource.
message ComputeInstanceTemplateReference {
  string id = 1;
  string name = 2;
  string project = 3;
  bool shared = 4;
}

// Reference to a ComputeInstanceCatalogItem resource.
message ComputeInstanceCatalogItemReference {
  string id = 1;
  string name = 2;
  string project = 3;
  bool shared = 4;
}

// Reference to an InstanceType resource.
message InstanceTypeReference {
  string id = 1;
  string name = 2;
  string project = 3;
  bool shared = 4;
}

// Local reference to an InstanceType resource.
message InstanceTypeLocalReference {
  string id = 1;
  string name = 2;
}

// Cluster and bare metal references

// Local reference to a Cluster resource.
message ClusterLocalReference {
  string id = 1;
  string name = 2;
}

// Reference to a ClusterTemplate resource.
message ClusterTemplateReference {
  string id = 1;
  string name = 2;
  string project = 3;
  bool shared = 4;
}

// Reference to a ClusterCatalogItem resource.
message ClusterCatalogItemReference {
  string id = 1;
  string name = 2;
  string project = 3;
  bool shared = 4;
}

// Reference to a HostType resource.
message HostTypeReference {
  string id = 1;
  string name = 2;
  string project = 3;
  bool shared = 4;
}

// Local reference to a BareMetalInstance resource.
message BareMetalInstanceLocalReference {
  string id = 1;
  string name = 2;
}

// Reference to a BareMetalInstanceCatalogItem resource.
message BareMetalInstanceCatalogItemReference {
  string id = 1;
  string name = 2;
  string project = 3;
  bool shared = 4;
}

// Reference to a BareMetalInstanceTemplate resource.
message BareMetalInstanceTemplateReference {
  string id = 1;
  string name = 2;
  string project = 3;
  bool shared = 4;
}

// IAM references

// Reference to a Role resource.
message RoleReference {
  string id = 1;
  string name = 2;
  string project = 3;
  bool shared = 4;
}

// Reference to a User resource.
message UserReference {
  string id = 1;
  string name = 2;
  string project = 3;
  bool shared = 4;
}
